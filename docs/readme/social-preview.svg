<text x="640" y="236" text-anchor="middle" class="sans" font-size="62" font-weight="600" letter-spacing="-1.8" fill="#fcfcfc">Save what catches your eye.</text>
<text x="640" y="304" text-anchor="middle" class="sans" font-size="62" font-weight="600" letter-spacing="-1.8" fill="#ec810c">Build with it.</text>
<text x="640" y="372" text-anchor="middle" class="sans" font-size="20" fill="#8c8c8c">Save UI inspiration from any app. A vision model curates it into a private</text>
<text x="640" y="402" text-anchor="middle" class="sans" font-size="20" fill="#8c8c8c">wiki and turns your taste into a DESIGN.md your coding agent builds from.</text>
