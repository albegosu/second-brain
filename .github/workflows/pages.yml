name: Capture page

# Publishes web/ (the capture page for Android and desktop) to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["web/**", "docs/readme/flow.svg", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The welcome shows the README's animation: copied here, it's always the current one.
      - name: Add the README's flow animation
        run: cp docs/readme/flow.svg web/flow.svg
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
