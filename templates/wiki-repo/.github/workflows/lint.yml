# Weekly lint pass over the wiki: merge duplicate topics, split catch-alls, move
# misfiled captures, relate topics and rewrite the pages that changed. It shares
# the capture workflow's concurrency group so the two never write at once.
name: lint

on:
  schedule:
    - cron: "40 6 * * 1"
  workflow_dispatch:
    inputs:
      recompose_all:
        description: Rewrite every topic page from its sources
        type: boolean
        default: false
      no_plan:
        description: Skip the reorganization, only apply the rules and rewrite pages
        type: boolean
        default: false

concurrency:
  group: capture
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the engine
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ENGINE_REPOSITORY || 'albegosu/second-brain' }}
          ref: ${{ vars.ENGINE_REF || 'main' }}
          path: engine
          ssh-key: ${{ secrets.ENGINE_DEPLOY_KEY }}  # only for a private engine; leave unset otherwise

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install dependencies
        run: pip install -q -r engine/requirements.txt

      - name: Lint the wiki
        working-directory: engine
        env:
          OLLAMA_HOST: https://ollama.com
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          BRAIN_VLM: gemma4:31b
          BRAIN_WIKI: ${{ github.workspace }}/wiki
          BRAIN_GIT_SYNC: "1"
          RECOMPOSE_ALL: ${{ inputs.recompose_all && '--recompose-all' || '' }}
          NO_PLAN: ${{ inputs.no_plan && '--no-plan' || '' }}
        run: |
          git -C "$GITHUB_WORKSPACE" config user.name "second-brain worker"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m worker.lint $RECOMPOSE_ALL $NO_PLAN
