# Processes the pending Supabase inbox and files each capture into wiki/.
#
# Supabase triggers it when a capture arrives (repository_dispatch, see the
# engine's db/supabase.sql). The 6-hour run picks up anything missed and the
# retries, and keeps the free Supabase project awake. The engine is checked out
# next to the wiki; a private fork of it needs a read-only deploy key.
name: capture

on:
  repository_dispatch:
    types: [capture]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

# One run at a time: capture numbers come from the wiki.
concurrency:
  group: capture
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The branch as it is now, not the commit the event was sent for: a run
      # queued behind another must see what that one pushed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          fetch-depth: 0

      - name: Check out the engine
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ENGINE_REPOSITORY || 'albegosu/second-brain' }}
          ref: ${{ vars.ENGINE_REF || 'main' }}
          path: engine
          ssh-key: ${{ secrets.ENGINE_DEPLOY_KEY }}  # only for a private engine; leave unset otherwise

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install ffmpeg and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q -r engine/requirements.txt

      # Screenshots use the runner's google-chrome. Ubuntu 24.04 blocks the user
      # namespaces its sandbox needs; allow them rather than run it --no-sandbox.
      - name: Let headless Chrome use its sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Process pending captures
        working-directory: engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HYPAR_URL: ${{ secrets.HYPAR_URL }}      # optional: plant "Idea to grow" notes in hypar
          HYPAR_TOKEN: ${{ secrets.HYPAR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          OLLAMA_HOST: https://ollama.com
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          BRAIN_VLM: gemma4:31b
          BRAIN_WIKI: ${{ github.workspace }}/wiki
          BRAIN_GIT_SYNC: "1"
        run: |
          git -C "$GITHUB_WORKSPACE" config user.name "second-brain worker"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m worker.run --once
